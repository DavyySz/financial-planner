# Auslieferung auf fly.io - NUR noch manuell ueber GitHub > Actions > "Run workflow".
# Automatisches Deployen bei jedem Push ist abgeschaltet, damit keine Kosten bei fly.io entstehen.
# Die App laeuft stattdessen kostenlos per ./start.sh (siehe README).

name: Fly Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
