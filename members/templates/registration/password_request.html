{% extends "base.html" %}

{% block title %}Passwort vergessen – Financial Planer{% endblock %}

{% block content %}
<div class="card auth">
  <h2>Passwort vergessen</h2>
  <p class="muted">Der Admin bekommt deine Anfrage angezeigt, setzt dir ein neues Passwort und teilt es dir mit.</p>
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Dein Benutzername</label>
    <input type="text" id="id_username" name="username" required autofocus maxlength="150">
    <label for="id_message">Nachricht an den Admin (optional)</label>
    <input type="text" id="id_message" name="message" maxlength="255" placeholder="z.B. wie der Admin dich erreichen kann">
    <button type="submit">Anfrage senden</button>
  </form>
  <p class="muted"><a href="{% url 'login' %}">Zurück zum Login</a></p>
</div>
{% endblock %}
